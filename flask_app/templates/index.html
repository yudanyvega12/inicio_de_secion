<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/registro" method="POST">
        <h1>Registro</h1>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre"><br>
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido"><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br>
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="password"><br>
       
        <label for="confirm_password">Conf. Contraseña:</label>
        <input type="password" id="confirm_password" name="confirm_password"><br><br>
        <button type="submit">Registrar</button>
    </form>

    <hr>

    <form action="/login" method="POST">
        <h1>Inicio de Sesión</h1>
        <label for="login_email">Email:</label>
        <input type="email" id="login_email" name="email"><br>
        <label for="login_password">Contraseña:</label>
        <input type="password" id="login_password" name="password"><br><br>
        <button type="submit">Iniciar Sesión</button>
    </form>

</body>
</html>
